<!--
  Supabase "Reset Password" email template for the OKC investor portal.

    GOES (not used by the app at runtime - it lives in Supabase):
    Supabase Dashboard > Authentication > Emails > Templates > "Reset Password"
    Paste the markup below into the message body and save.

  The link targets the app's /auth/confirm route (app/auth/confirm/route.ts),
  which exchanges {{ .TokenHash }} for a session and forwards to
  /change-password. Styling mirrors lib/email.ts (the invite email) so both
  emails look like they come from the same portal.

  Supabase template variables ({{ .SiteURL }}, {{ .TokenHash }}) are filled in
  by Supabase when the email is sent - leave them as-is.

  WHY THIS AND NOT THE SUPABASE DEFAULT ({{ .ConfirmationURL }}):
  the default routes through Supabase's own /auth/v1/verify, which hands the
  session back in the URL *fragment* (#access_token=...). Fragments are never
  sent to the server, so /auth/confirm sees no token and the user gets "That
  reset link is invalid or has expired". The default only works when the reset
  was started from this app in the SAME browser, because that path uses PKCE
  and returns ?code=... instead - which also means the link dies if the user
  requests the reset on their phone and opens the email on their laptop. The
  token_hash form below has neither problem: no fragment, no browser-bound
  code_verifier cookie, and no dependency on the redirect allowlist.

  ONE DEPENDENCY: the URL is built from {{ .SiteURL }}, so Authentication >
  URL Configuration > Site URL must point at the deployed app. If it still
  says http://localhost:3000 in production, every reset email will too.

  The &amp; below are deliberate: a bare "&" in an href is an ambiguous
  ampersand that some email clients mangle.
-->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 520px; margin: 0 auto; color: #071437;">
  <h2 style="color: #071437;">Reset your OKC portal password</h2>
  <p>We received a request to reset the password for your OKC investor portal account.</p>
  <p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/change-password"
       style="display: inline-block; background: #1f6bff; color: #ffffff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold;">
      Choose a new password
    </a>
  </p>
  <p style="color: #6b7894; font-size: 14px;">
    This link expires in one hour and can be used once. If you didn't request a
    password reset, you can safely ignore this email &dash; your password won't change.
  </p>
</div>
