# Elastic Beanstalk includes every .conf here in nginx's `http` block, so these
# apply to all proxying to the Node server.

# CSV uploads (Operations -> Data Import) pass through this nginx before
# reaching the Node server. nginx defaults to a 1 MB request body and answers
# 413 above it, which surfaces in the UI as an unexplained failed import.
# 10 MB matches Next's own proxy body limit for this build.
client_max_body_size 10m;

# Sign-in was returning 502 with "upstream sent too big header while reading
# response header from upstream" in error.log, on the POST /login response ONLY.
#
# Supabase stores the session as a JWT split across chunked cookies
# (sb-<ref>-auth-token.0, .1, ...). The sign-in response is the one that sets
# them all at once, and together with the five security headers from
# next.config.ts the response HEADER block exceeds nginx's default 4k/8k proxy
# buffer. nginx then discards the whole response and answers 502.
#
# The failure is vicious because it looks like bad credentials: the server
# action has already run, so Supabase records the login and the audit trail
# says LOGIN_SUCCESS — but the Set-Cookie headers die with the response, the
# browser never gets a session, and the next request bounces back to /login
# with no error shown. Only nginx's error.log names the real cause.
#
# Headroom is deliberate: a JWT grows with its claims (role, aal, factors), so
# a value that merely fits today would fail again for whichever account
# happens to carry the largest token.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
